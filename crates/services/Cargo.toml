[package]
name = "digup-services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "JSON-lines services (Rust port): search-service / index-service / worker / download-model. Scaffold — Phase 3+."

[dependencies]
digup-core = { workspace = true }
digup-runtime = { workspace = true }
digup-native = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }

[features]
# Faces (FACES.md): the face verbs daemon on the tract pipeline; the payload
# default never builds it (the `faces` cargo feature pulls in tract-onnx).
faces = ["digup-runtime/faces"]

[dev-dependencies]
tempfile = { workspace = true }

[[test]]
name = "faces_move"
required-features = ["faces"]

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
