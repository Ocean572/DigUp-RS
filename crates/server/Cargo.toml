[package]
name = "digup-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "HTTP /api/v1 wrapper (Rust port): FastAPI -> axum"

[[bin]]
name = "digup-server"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
chrono = { workspace = true }
# The MCP peer core (search/status/estimate/index relay + JSON-RPC shapes) lives in
# the services crate, shared verbatim with the stdio front-end.
digup-services = { workspace = true }
# The faces surface reads the weight pins (FaceModelFiles) — the same pins the
# engine's download verb checks (crates/runtime/src/models.rs).
digup-runtime = { workspace = true }
httpdate = { workspace = true }
libc = { workspace = true }
futures-util = { workspace = true }
md5 = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
