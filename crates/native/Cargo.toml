[package]
name = "digup-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The C-backed readers of the Rust port: stb pictures (decode, turn, scale, write), PDFium pages, ffmpeg media. Links the same vendored libraries the Swift engine links (Vendor/stb, Vendor/pdfium)."

[dependencies]
digup-core = { workspace = true }
libc = { workspace = true }
resvg = { workspace = true }

[build-dependencies]
cc = { workspace = true }

[package.metadata.cargo-machete]
# build.rs compiles the pinned C shims (stb image IO) with cc; cargo-machete analyzes
# src/, not build scripts, so it cannot see the only user of this build-dependency.
ignored = ["cc"]

# The picture pins compare pixels, so the test side hashes them (`sha2` is the same digest the
# engine's `SHA256.swift` uses) and spells the digests in hex.
[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
