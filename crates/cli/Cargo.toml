[package]
name = "digup-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The `digup` binary (Rust port): estimate/index/search/status/speed/eval + services. Scaffold — Phase 5+."

[[bin]]
name = "digup"
path = "src/main.rs"

[dependencies]
digup-core = { workspace = true }
digup-native = { workspace = true }
digup-runtime = { workspace = true }
digup-services = { workspace = true }
serde_json = { workspace = true }
unicode-segmentation = { workspace = true }

[features]
# Faces (FACES.md): the faces-service daemon + face verbs; default payload
# builds never enable it (it pulls in tract-onnx through the services feature).
faces = ["digup-services/faces"]

[dev-dependencies]
# tests/cli.rs runs the verbs against the built binary and reads the SQLite files they write.
rusqlite = { workspace = true }
tempfile = { workspace = true }
