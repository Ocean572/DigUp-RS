[package]
name = "digup-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "EmbeddingGemma 2 on the vendored llama.cpp (Rust port): 768×fp16 embedder, device choice."

[dependencies]
digup-core = { workspace = true }
# The Indexer's prepare stage reads files through the C-backed readers (stb pictures, PDFium
# pages, ffmpeg media) — the same seams the Swift engine's prepare runs on Linux.
digup-native = { workspace = true }
half = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
unicode-segmentation = { workspace = true }
# Faces (FACES.md): the tract ONNX engine behind the `faces` feature — CPU-only inference,
# zero C runtime binaries (the payload stays lean). Default payload builds never enable it.
tract-onnx = { workspace = true, optional = true }

[features]
faces = ["dep:tract-onnx"]

[build-dependencies]
bindgen = { workspace = true }

[package.metadata.cargo-machete]
# build.rs runs bindgen over Vendor/llama/include (the ffi module is its generated
# output); cargo-machete analyzes src/, not build scripts, so it cannot see the only
# user of this build-dependency.
ignored = ["bindgen"]

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# The ⑨ index suite: rebuilds the corpus (sha2), stamps mtimes (libc), replays the engine's
# dumps through rusqlite, decodes fp16 vectors (half), and works in a temp folder (tempfile).
libc = { workspace = true }
rusqlite = { workspace = true }
tempfile = { workspace = true }
sha2 = { workspace = true }
half = { workspace = true }
