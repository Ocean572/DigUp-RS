[project]
name = "digup-server"
version = "0.9.0"
description = "DigUp as a self-hosted search server: the contract suite's harness around the Rust server (`digup-server`), speaking only DigUp's own JSON-lines protocol"
requires-python = ">=3.12,<3.13"
# Plan P3 (docs/implementation/python-free-plan.md): the product's server is Rust
# (`crates/server` → `digup-server`), so this project has NO runtime dependencies — the
# suite spawns the shipping binary and talks HTTP to it. Python here is the harness
# (P4 records what stays Python, on purpose): stdlib subprocess/json/socket, plus the
# two dev packages below. `uv.lock` pins exact versions.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",   # the live-shape client: the suite is a thin client of the binary
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` on the path: the suite's own modules (conftest, support, the engine harness
# package) import each other by name, the same way the harness has always done it.
pythonpath = ["tests"]
# The slow mark times the model (`speed --model`, ~1 min): part of the proof run, not of every test run.
addopts = "-q -m 'not slow'"
markers = [
    "slow: needs the model timed on this machine (runs in the container proof, `pytest -m slow`)",
]
