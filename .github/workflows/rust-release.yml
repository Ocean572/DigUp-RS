# Stage 6 (the Rust port, user-directed override — AGENTS.md "Rust port"): build the
# Rust engine for every platform it ships on, and publish a tagged release's artifacts
# and update feeds. Gates first, artifacts after: the workspace suite (schema v6 byte
# parity, the vector parity tests, the JSON-lines protocol tests) and the contract suite
# against the Rust payload (`.github/workflows/server.yml`'s server-rust job is the same
# bar, run per push; this job re-runs it for the tag being published, so a tag is proven
# on its own commit, never on a neighbour's green check).
#
#   cargo test --workspace          schema + vectors + protocol + CLI units, the port's own gate
#   server-test-rust + pytest -rs   0 failed, 0 SKIPPED — every SKIPPED line is a FAIL
#   scripts/rust/package-*.sh       payload per platform, from the same commit
#
# By hand: `gh workflow run rust-release.yml -f ref=<branch or tag>`. A tag publish
# (v*) additionally runs publish: the release's assets, the Homebrew formula
# (brew install --cask …/digup keeps pointing at the release), the Tauri update feeds
# (updates/<os>-<arch>.json, the mechanism the shell's updater reads).
#
# Native builds only (§11): each payload is compiled on its own architecture, inside a
# base whose glibc is at most what the oldest target ships (Ubuntu 22.04 → glibc 2.35;
# GitHub's ubuntu-22.04 runners are retired, so the container line carries the base).
name: Rust release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build
        default: main
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: rust-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    # Ubuntu 22.04 CONTAINER — ci.yml's proven Linux pattern (apt, toolchain, tests all
    # inside the base image). The container is measured necessity, not style: the
    # byte-pinned media suites (engine_answers_match) pin the WAV output of the pinned
    # 4.4.2 ffmpeg — "the same build the Swift container's /usr/bin/ffmpeg is", which is
    # the 22.04 apt build; 24.04's apt is not, and build-ffmpeg.sh's shipping build
    # (9.0.2) writes the WAV bytes differently (the BWF metadata chunk names the build).
    # Vendor compiles natively here — the glibc floor of §11 comes free with the base.
    name: Gates (Ubuntu 22.04 container)
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 120
    steps:
      - name: Build tools (ffmpeg = the 4.4.2 apt build the fixtures pin)
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            ca-certificates curl git gnupg xz-utils unzip python3 binutils build-essential \
            cmake ninja-build meson nasm pkg-config file patchelf clang libclang-dev \
            zlib1g-dev libcurl4-openssl-dev libxml2-dev libedit2 libsqlite3-0 libz3-dev \
            libpython3-dev tzdata yasm ffmpeg
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Rust (pinned — the workspace's floor is rust-version = 1.88, sha2 0.11's demand)
        run: |
          # /opt toolchain homes, world-readable: the suite runs as an unprivileged
          # user (see the suite step), and /root/.cargo would be 700 to it.
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o rustup.sh
          CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup sh rustup.sh -y -q --profile minimal --default-toolchain 1.99.1
          rm -f rustup.sh
          chmod -R a+rX /opt/cargo /opt/rustup
          echo "/opt/cargo/bin" >> "$GITHUB_PATH"
        shell: bash
      - name: Vendored libraries and llama.cpp (native on the base image — glibc floor)
        run: |
          # CC=clang pins the toolchain the ⑩ suite's floats are pinned to: the ⑩
          # fixtures' z values are reproduced digit-for-digit ONLY by the clang build
          # with OpenMP OFF (GGML_OPENMP_ENABLED=OFF — clang has no libomp here); a
          # gcc/cc build enables OpenMP, whose parallel reductions reorder the f32
          # accumulations, and the pool means drift z by ~8e-9 (18M f64 ulps ≫ the
          # 2-ulp floor) — measured 2026-11-15 on this repo's main tree.
          scripts/fetch-vendor.sh
          rm -f Vendor/llama-build/CMakeCache.txt
          export CC=clang CXX=clang++
          tries=0; until ./scripts/build-llama.sh; do tries=$((tries+1)); [ "$tries" -ge 3 ] && exit 1; \
            echo "build-llama: attempt $tries failed; retrying in 30 s"; sleep 30; done
        shell: bash
      - name: Model files, pinned by Sources/DigUpKit/ModelFiles.swift (server.yml's recipe)
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          rev=bfcd298762cc34d0357ece5ebdd31791a3a374d8
          base=https://huggingface.co/ggml-org/embeddinggemma-2-GGUF/resolve/$rev
          curl -fsSL -o "$RUNNER_TEMP/models/embeddinggemma-2-Q8_0.gguf" \
            "$base/embeddinggemma-2-Q8_0.gguf"
          curl -fsSL -o "$RUNNER_TEMP/models/mmproj-embeddinggemma-2-Q8_0.gguf" \
            "$base/mmproj-embeddinggemma-2-Q8_0.gguf"
          echo "2188ac1deca4b77dffefd603c2776a9d76d9d74ec01841392982ebb840b09135  $RUNNER_TEMP/models/embeddinggemma-2-Q8_0.gguf" > "$RUNNER_TEMP/pins.txt"
          echo "c4a8a52691ecef40618438928bdf9e68379b854e24166f292592353db0aab64f  $RUNNER_TEMP/models/mmproj-embeddinggemma-2-Q8_0.gguf" >> "$RUNNER_TEMP/pins.txt"
          sha256sum -c "$RUNNER_TEMP/pins.txt"
        shell: bash
      - name: Workspace suite (schema v6, vector parity, protocol, CLI units — the ⑩ suite included)
        run: |
          # The suite runs as an unprivileged user, measured necessity (2026-11-16):
          # the suite pins WRITE-FAILURE refusals (pdf.rs: the render folder goes
          # chmod 0500, the seam must answer "can't write …png" — Swift's throw at
          # PDF+Portable.swift:111), and a container's root overrides DAC: the
          # "unwritable" folder takes the writes, the premise is nullified, and the
          # test's terminal panic (the fails-before pin) fires with the writes
          # SUCCEEDING (measured on CI as root: "3 pages with 3 pictures, 3 files
          # on disk"). Every measured suite run — the Mac, the battery host — was a
          # normal user; the gates answer as one too. Build stays root's (chown to
          # the suite user, toolchain homes world-readable).
          useradd -m -d /home/ci ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
          chmod -R a+rX "$RUNNER_TEMP/models"
          su ci -s /bin/bash -c 'cd "$1" && HOME=/home/ci RUSTUP_HOME=/opt/rustup CARGO_HOME=/home/ci/.cargo PATH=/opt/cargo/bin:/usr/bin:/bin \
            LD_LIBRARY_PATH="$1/Vendor/pdfium/lib:$1/Vendor/llama/lib" \
            DIGUP_BACKENDS="$1/Vendor/llama/lib" DIGUP_MODELS="$2" DIGUP_FFMPEG=/usr/bin \
            DIGUP_DEVICE=cpu DIGUP_THREADS=8 CARGO_NET_GIT_FETCH_WITH_CLI=true \
            cargo test --workspace' _ "$GITHUB_WORKSPACE" "$RUNNER_TEMP/models"
        shell: bash
      - name: The CLI answers from its own build
        run: ./target/debug/digup --help | sed -n '2p'
        shell: bash

  # The contract suite against the Rust payload, for the commit being published:
  # the same zero-skip bar as server.yml's server-rust job, with every mount.
  suite:
    name: Contract suite (Rust payload)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Model pins follow the engine (drift guard)
        run: |
          engine=$(grep -oE 'sha256: "[0-9a-f]{64}"' Sources/DigUpKit/ModelFiles.swift | grep -oE '[0-9a-f]{64}' | sort)
          ci=$(printf '%s\n%s\n' \
            2188ac1deca4b77dffefd603c2776a9d76d9d74ec01841392982ebb840b09135 \
            c4a8a52691ecef40618438928bdf9e68379b854e24166f292592353db0aab64f | sort)
          [ "$engine" = "$ci" ] || { echo "::error::model pins drift between ModelFiles.swift and CI"; exit 1; }
      - name: Models (the pinned GGUF files, hash-checked)
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          base=https://huggingface.co/ggml-org/embeddinggemma-2-GGUF/resolve/bfcd298762cc34d0357ece5ebdd31791a3a374d8
          curl -fsSL -o "$RUNNER_TEMP/models/embeddinggemma-2-Q8_0.gguf" \
            "$base/embeddinggemma-2-Q8_0.gguf"
          curl -fsSL -o "$RUNNER_TEMP/models/mmproj-embeddinggemma-2-Q8_0.gguf" \
            "$base/mmproj-embeddinggemma-2-Q8_0.gguf"
          echo "2188ac1deca4b77dffefd603c2776a9d76d9d74ec01841392982ebb840b09135  $RUNNER_TEMP/models/embeddinggemma-2-Q8_0.gguf" > "$RUNNER_TEMP/pins.txt"
          echo "c4a8a52691ecef40618438928bdf9e68379b854e24166f292592353db0aab64f  $RUNNER_TEMP/models/mmproj-embeddinggemma-2-Q8_0.gguf" >> "$RUNNER_TEMP/pins.txt"
          sha256sum -c "$RUNNER_TEMP/pins.txt"
      - name: Corpus (the 15-file suite corpus; the clip needs libx264)
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ffmpeg
          server/tests/corpus/build.sh
          test -f server/tests/corpus/media/clips/scenes.mp4
      - name: Build the test image (Rust payload)
        run: |
          DOCKER_BUILDKIT=1 docker build --target server-test-rust \
            -f server/docker/Dockerfile -t digup-server-test-rust:ci .
      - name: The suite (0 failed, 0 skipped)
        run: |
          mkdir -p "$RUNNER_TEMP/index"
          docker run --rm \
            -v "$GITHUB_WORKSPACE/server/tests/corpus/media:/corpus:ro" \
            -v "$GITHUB_WORKSPACE/server/tests/corpus:/corpus-root:ro" \
            -v "$RUNNER_TEMP/models:/models:ro" \
            -v "$RUNNER_TEMP/index:/index" \
            digup-server-test-rust:ci /srv/server/.venv/bin/pytest -rs 2>&1 | tee "$RUNNER_TEMP/suite.log"
          if grep -qE '^(SKIPPED|tests/.*SKIPPED)' "$RUNNER_TEMP/suite.log"; then
            echo "::error::a test SKIPPED in CI — the suite self-skipping is a green-by-construction lie"
            grep -E 'SKIPPED' "$RUNNER_TEMP/suite.log" | head -20
            exit 1
          fi
          grep -qE '[0-9]+ passed' "$RUNNER_TEMP/suite.log"

  packages:
    name: Payload (${{ matrix.name }})
    needs: [gates, suite]
    if: ${{ github.event_name == 'release' || github.event.inputs.ref != 'main' || github.ref_type == 'tag' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runs-on: ubuntu-24.04
            container: ubuntu:22.04
            script: scripts/rust/package-linux.sh
          - name: linux-aarch64
            runs-on: ubuntu-24.04-arm
            container: ubuntu:22.04
            script: scripts/rust/package-linux.sh
          - name: macos-universal
            runs-on: macos-26
            script: scripts/rust/package-macos.sh
          - name: windows-x86_64
            runs-on: windows-latest
            script: scripts/rust/package-windows.sh
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Build tools (Linux)
        if: ${{ startsWith(matrix.name, 'linux') }}
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            ca-certificates curl git gnupg xz-utils unzip python3 binutils build-essential cmake ninja-build \
            meson nasm pkg-config patchelf file zlib1g-dev libcurl4-openssl-dev libxml2-dev libedit2 \
            libsqlite3-0 libz3-dev libpython3-dev tzdata libgomp1 clang libclang-dev libssl-dev
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        if: matrix.name == 'windows-x86_64'
        with:
          msystem: MINGW64
          release: false   # the runner's own MSYS2
          update: true
          install: >-
            make mingw-w64-x86_64-gcc mingw-w64-x86_64-meson mingw-w64-x86_64-ninja mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf mingw-w64-x86_64-zlib
      - name: ffmpeg (MSYS2 MinGW — packages.yml's proven Windows seeding)
        if: matrix.name == 'windows-x86_64'
        shell: msys2 {0}
        run: scripts/build-ffmpeg.sh
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: matrix.name == 'windows-x86_64'
      - name: Rust (pinned)
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o rustup.sh
          sh rustup.sh -y -q --profile minimal --default-toolchain 1.99.1
          rm -f rustup.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          if [ "${{ startsWith(matrix.name, 'macos') }}" = "true" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi
      - name: Payload (unix — vendor seeding, then the script, in the base image's toolchain)
        if: matrix.name != 'windows-x86_64'
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true
        run: |
          scripts/fetch-vendor.sh
          scripts/build-llama.sh
          ${{ matrix.script }}
      - name: Payload (Windows — Git bash in the MSVC environment, the loader's own-folder rule)
        if: matrix.name == 'windows-x86_64'
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true
        run: |
          # MSVC's tools before Git's: Git's /usr/bin/link (coreutils) would stand in for link.exe.
          export PATH="$(dirname "$(command -v cl)"):$PATH"
          scripts/fetch-vendor.sh
          scripts/build-llama.sh
          scripts/rust/package-windows.sh
      - name: The packaged CLI answers
        shell: bash
        run: |
          set -eu
          smoke=$(mktemp -d)
          if [ "${{ startsWith(matrix.name, 'windows') }}" = "true" ]; then
            unzip -q dist/*.zip -d "$smoke"
          else
            tar -xzf dist/*.tar.gz -C "$smoke"
          fi
          exe=$(find "$smoke" \( -name digup -o -name digup.exe \) -type f | head -1)
          "$exe" --help | sed -n '2p'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: payload-${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error
      - name: Payload (zip, Windows)
        if: ${{ matrix.name == 'windows-x86_64' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: payload-windows-zip
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish a tagged release
    needs: packages
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: payload-*
          path: payloads
          merge-multiple: true
      - name: The payloads, onto the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          for file in payloads/*; do
            gh release upload "$TAG" "$file" --clobber
          done
      # The Homebrew formula for the engine CLI (`brew install ocean572/tap/digup`):
      # a tarball of the payload, its sha256 computed here so a bump updates one line.
      # The tap repo and its token are the same shape as .github/workflows/homebrew.yml.
      - name: Homebrew formula (engine CLI), pushed to the tap
        if: ${{ github.ref_type == 'tag' }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          [ -n "${TAP_TOKEN:-}" ] || { echo "no HOMEBREW_TAP_TOKEN secret — the formula step is inert; brew needs the tap repo + token"; exit 0; }
          version=${TAG#v}
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          sha() { sha256sum "$1" | cut -d" " -f1; }
          linux_x86=$(ls payloads/digup-*-linux-x86_64.tar.gz | head -1)
          linux_arm=$(ls payloads/digup-*-linux-aarch64.tar.gz | head -1)
          macos=$(ls payloads/digup-*-macos-universal.tar.gz | head -1)
          mkdir -p formula
          cat > formula/digup.rb <<RB
          class Digup < Formula
            desc "DigUp engine: local semantic search over your files (Rust core)"
            homepage "https://github.com/$GITHUB_REPOSITORY"
            version "$version"
            on_macos do
              url "$base/$(basename "$macos")"
              sha256 "$(sha "$macos")"
            end
            on_linux do
              on_intel do
                url "$base/$(basename "$linux_x86")"
                sha256 "$(sha "$linux_x86")"
              end
              on_arm do
                url "$base/$(basename "$linux_arm")"
                sha256 "$(sha "$linux_arm")"
              end
            end
            def install
              prefix.install Dir["payload/*"]
              bin.install_symlink "digup", "digup-server"
            end
          end
          RB
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/ocean572/homebrew-tap.git" tap
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p tap/Formula
          cp formula/digup.rb tap/Formula/digup.rb
          git -C tap add -A
          if git -C tap diff --cached --quiet; then echo "Formula/digup.rb already at $version"; else
            git -C tap commit -m "digup $version (Rust core)"
            git -C tap push
          fi
