# Builds and tests the engine on every pull request and push to main: the Rust workspace
# (crates/ → digup + digup-server) in the Ubuntu 22.04 container the packages are built in,
# plus the Windows/Linux shell's Rust tests. The model files aren't fetched, so the
# model-dependent tests skip themselves by design (they print the reason); everything else
# runs, and the workspace suite is the engine's gate. Also by hand: `gh workflow run ci.yml`.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    # The Rust engine, in the Ubuntu 22.04 CONTAINER (rust-release.yml's gates job, same
    # recipe): Vendor compiles natively on the base image — the glibc floor of §11 comes
    # free. The toolchain is pinned 1.99.1 (the workspace's rust-version floor is 1.89;
    # the distro cargo lags), and bindgen needs clang + libclang-dev. fmt and clippy are
    # gates: -D warnings keeps the workspace's own bar. cargo test --workspace is the
    # engine suite: the model-dependent tests (reference vectors, the index suite) skip
    # themselves with a printed reason when the models/GGUFs aren't there — the CI bar
    # for THIS chain is the model-free suite; the model-pinned gates run in
    # rust-release.yml's gates job, which downloads the pinned files.
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 90
    env:
      RUSTUP_HOME: /opt/rustup
      CARGO_HOME: /opt/cargo
    steps:
      - name: Build tools
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ca-certificates curl git gnupg \
            xz-utils unzip python3 binutils build-essential cmake ninja-build meson nasm pkg-config file \
            clang libclang-dev \
            zlib1g-dev libcurl4-openssl-dev libxml2-dev libedit2 libsqlite3-0 libz3-dev libpython3-dev tzdata
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust (pinned)
        run: |
          # /opt toolchain homes, world-readable: the suite runs as an unprivileged
          # user (the Test step, the gates job's recipe) and root's ~/.cargo is 700
          # to it.
          curl --proto '=https' '--tlsv1.2' -fsSL https://sh.rustup.rs -o rustup.sh
          CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup sh rustup.sh -y -q --profile minimal --default-toolchain 1.99.1 --component rustfmt,clippy
          rm -f rustup.sh
          chmod -R a+rX /opt/cargo /opt/rustup
          echo "/opt/cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Vendor/ffmpeg
          key: ffmpeg-linux-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Vendor/llama
          key: llama-linux-cpu-${{ hashFiles('scripts/build-llama.sh') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Vendor/libraw
          key: libraw-linux-${{ hashFiles('scripts/build-libraw.sh', 'scripts/fetch-vendor.sh') }}
      - name: Vendored libraries, ffmpeg, llama.cpp, LibRaw
        # The small ffmpeg the packages carry (the image and video tests read HEIC, WebP and MPEG-TS through it);
        # built once per version of its script, then cached. llama.cpp with the CPU backend only.
        # LibRaw (camera RAW, #152): the vendor tree's own make, static, cached the same way.
        run: |
          scripts/fetch-vendor.sh
          scripts/build-ffmpeg.sh
          scripts/build-llama.sh
          scripts/build-libraw.sh
      - name: Format gate
        run: cargo fmt --all --check
      - name: Clippy
        run: |
          # bindgen needs libclang (installed above); -D warnings keeps the workspace's bar.
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: |
          # The suite runs as an unprivileged user — the gates job's measured necessity
          # (rust-release.yml 2026-11-16), applied here when the engine job joined as
          # the suite's Linux home (2026-11-18, run 44234229551): a container's root
          # overrides DAC, so the suite's write-failure pins are nullified for it —
          # pdf.rs's chmod 0500 render folder takes the writes, and the pin that fires
          # "before the fix" reports the writes SUCCEEDING ("3 pages with 3 pictures,
          # 3 files on disk", measured on this chain as root). Every measured suite
          # run — the Mac, the battery host, the gates job — answers as a normal user;
          # so does this. Build stays root's (fmt + clippy above); the workspace goes
          # to the suite user, the toolchain homes are the world-readable /opt
          # installs, CARGO_HOME moves to the user's writable home. The C libraries
          # ride where the tests find them: llama through DIGUP_BACKENDS (the
          # runtime's lookup), ffmpeg beside the binary (Media's find), matching the
          # payload layout the Docker stages ship.
          useradd -m -d /home/ci ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
          # shellcheck disable=SC2016
          # The single quotes are the point: "$1" expands inside the su'd shell, the
          # workspace path travels to it as the positional arg.
          su ci -s /bin/bash -c 'cd "$1" && HOME=/home/ci RUSTUP_HOME=/opt/rustup CARGO_HOME=/home/ci/.cargo PATH=/opt/cargo/bin:/usr/bin:/bin \
            LD_LIBRARY_PATH="$1/Vendor/llama/lib:$1/Vendor/pdfium/lib" \
            DIGUP_BACKENDS="$1/Vendor/llama/lib" DIGUP_FFMPEG="$1/Vendor/ffmpeg/bin" \
            DIGUP_DEVICE=cpu DIGUP_THREADS=8 CARGO_NET_GIT_FETCH_WITH_CLI=true \
            cargo test --workspace --all-targets' _ "$GITHUB_WORKSPACE"

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build tools
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shell/src-tauri/target
          key: cargo-${{ hashFiles('shell/src-tauri/Cargo.lock') }}
      - name: Test
        working-directory: shell/src-tauri
        run: cargo test
      - name: Shell input tests
        run: node --test shell/tests/*.test.cjs
