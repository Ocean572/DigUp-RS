# The last parity record Swift answers on main (Operation Swift-Free, P3 preflight): the twin gate —
# two engines, ONE corpus, byte-diffed answers — measured on a tip that still carries Sources/, before
# the deletion commit lands. The numbers join the ledger in docs/RUST_PORT_AUDIT.md, and this workflow
# is deleted with the Swift sources (it exists to record, not to keep Swift building).
# By hand: `gh workflow run swift-farewell.yml` (or the Actions form), ref = the tip to record.
name: Swift farewell twin

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build
        default: main

permissions:
  contents: read

jobs:
  twin:
    # The Swift leg's proven seeding (ci.yml's Linux job, 2026-11-17): the 6.4.0 toolchain verified
    # against swift.org's key, Vendor from scripts/fetch-vendor.sh, the decode-only ffmpeg, llama.cpp
    # with the CPU backend; plus the Rust side's libclang for bindgen. CPU-only device (gate A
    # shape): the twin compares scoring TEXT, so it must not ride two different GPU code paths.
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 150
    steps:
      - name: Build tools
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ca-certificates curl git gnupg \
            xz-utils unzip python3 binutils build-essential cmake ninja-build meson nasm pkg-config file \
            zlib1g-dev libcurl4-openssl-dev libxml2-dev libedit2 libsqlite3-0 libz3-dev libpython3-dev tzdata \
            clang libclang-dev libssl-dev ffmpeg
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Swift 6.4 (the pinned recipe, verified against swift.org's key)
        run: |
          version=6.4.0
          url=https://download.swift.org/swift-$version-release/ubuntu2204/swift-$version-RELEASE/swift-$version-RELEASE-ubuntu22.04.tar.gz
          curl -fsSL -o swift.tar.gz "$url"
          curl -fsSL -o swift.tar.gz.sig "$url.sig"
          curl -fsSL --compressed https://www.swift.org/keys/all-keys.asc | gpg --quiet --import
          gpg --verify swift.tar.gz.sig swift.tar.gz
          mkdir -p "$RUNNER_TEMP/swift"
          tar -xzf swift.tar.gz -C "$RUNNER_TEMP/swift" --strip-components 1
          rm swift.tar.gz swift.tar.gz.sig
          echo "$RUNNER_TEMP/swift/usr/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Vendor/ffmpeg
          key: ffmpeg-linux-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Vendor/llama
          key: llama-linux-cpu-${{ hashFiles('scripts/build-llama.sh') }}
      - name: Vendored libraries, ffmpeg, llama.cpp
        run: |
          scripts/fetch-vendor.sh
          scripts/build-ffmpeg.sh
          scripts/build-llama.sh
      - name: Rust (pinned)
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o rustup.sh
          sh rustup.sh -y -q --profile minimal --default-toolchain 1.99.1
          rm -f rustup.sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: The two engines
        run: |
          swift build -c release
          cargo build -q --release -p digup-cli
      - name: Model files (Sources/DigUpKit/ModelFiles.swift pins == crates/runtime/src/models.rs)
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          rev=bfcd298762cc34d0357ece5ebdd31791a3a374d8
          base=https://huggingface.co/ggml-org/embeddinggemma-2-GGUF/resolve/$rev
          curl -fsSL -o "$RUNNER_TEMP/models/embeddinggemma-2-Q8_0.gguf" \
            "$base/embeddinggemma-2-Q8_0.gguf"
          curl -fsSL -o "$RUNNER_TEMP/models/mmproj-embeddinggemma-2-Q8_0.gguf" \
            "$base/mmproj-embeddinggemma-2-Q8_0.gguf"
          echo "2188ac1deca4b77dffefd603c2776a9d76d9d74ec01841392982ebb840b09135  $RUNNER_TEMP/models/embeddinggemma-2-Q8_0.gguf" > "$RUNNER_TEMP/pins.txt"
          echo "c4a8a52691ecef40618438928bdf9e68379b854e24166f292592353db0aab64f  $RUNNER_TEMP/models/mmproj-embeddinggemma-2-Q8_0.gguf" >> "$RUNNER_TEMP/pins.txt"
          sha256sum -c "$RUNNER_TEMP/pins.txt"
      - name: The corpus (12 photos + 2 videos pinned in git; the synthetic clip needs an x264 encoder — apt's ffmpeg)
        run: |
          server/tests/corpus/build.sh
          test -f server/tests/corpus/media/clips/scenes.mp4
      - name: The twin gate — two engines, one corpus, byte-diffed answers
        env:
          DIGUP_MODELS: ${{ runner.temp }}/models
          DIGUP_BACKENDS: ${{ github.workspace }}/Vendor/llama/lib
          DIGUP_FFMPEG: ${{ github.workspace }}/Vendor/ffmpeg/bin
          DIGUP_GATE_LOG: ${{ github.workspace }}/gate-logs
          DIGUP_DEVICE: cpu
        run: scripts/rust/twin-gate.sh .build/release/digup target/release/digup server/tests/corpus/media
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: twin-farewell-logs
          path: gate-logs/
