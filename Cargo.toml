[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/native",
    "crates/runtime",
    "crates/services",
    "crates/cli",
    "crates/server",
    "crates/platform",
]
# The Tauri desktop shell is its own cargo graph (its manifest is not a workspace
# member — `cargo metadata` refuses a nested package that believes it lives in this
# workspace; cargo-machete walks every nested manifest and hits exactly that).
exclude = ["shell/src-tauri"]

# digup-core: the pure-Rust engine port. The crate split mirrors ARCHITECTURE_MAP.md §3 so the
# map stays the spec. Only `core` is implemented in Phase 1 (the rusqlite storage foundation);
# the rest are scaffold stubs so the workspace builds end to end.

[workspace.package]
version = "0.8.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Ocean572/DigUp"
publish = false

# Shared dependency versions, declared once (the repo convention from `worker/` and
# `server/pyproject.toml`: pin, don't resolve ad-hoc per crate).
[workspace.dependencies]
digup-core = { path = "crates/core" }
digup-native = { path = "crates/native" }
digup-runtime = { path = "crates/runtime" }
digup-services = { path = "crates/services" }
digup-platform = { path = "crates/platform" }

# `bundled` compiles the SQLite amalgamation with FTS5 + JSON1 enabled — the same feature set
# `scripts/fetch-vendor.sh` builds into Vendor/sqlite (SQLITE_ENABLE_FTS5). A port that lacks
# FTS5 cannot create the `fts` virtual table; the schema test proves it is present.
rusqlite = { version = "0.41", features = ["bundled"] }
base64 = "0.23.1"
thiserror = "2"
unicode-normalization = "0.1"
unicode-general-category = "1"
unicode-segmentation = "1"
tempfile = "3"
memmap2 = "0.9"
libc = "0.2"
walkdir = "2"
# Phase 2 step 8b (the doc readers): the Office zips inflate with the same RFC 1951 stream miniz
# feeds the engine (`flate2`'s pure-Rust backend), and the HTML strip needs a regex engine that
# supports case-insensitive class-free patterns the way Foundation's `NSRegularExpression` does.
flate2 = "1"
regex = "1"
# Phase 2 step 8c (crates/native): the vendored stb builds with `cc` — the same single translation
# unit and the same `-w` the Swift package's CStb target uses, so decodes, resizes and writes are
# the engine's own C code, not a Rust reimplementation of it.
cc = "1"

# Phase 2 (crates/runtime): the fp16 vector format the engine stores (`Vectors.swift`), the model
# file pins (`ModelFiles.swift`), and the bindings for the vendored, pinned llama.cpp
# (`scripts/build-llama.sh` → Vendor/llama). bindgen's `runtime` feature loads libclang at run time.
half = "2"
sha2 = "0.11"
hex = "0.4"
bindgen = { version = "0.73", features = ["runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Phase 4 (the axum server): the HTTP layer the FastAPI wrapper is replaced by. tokio is the
# runtime the axum handlers run on; the JSON-lines helper client blocks on pipes, so its calls
# run through `spawn_blocking` — the helper processes are the engine's, unchanged.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "fs"] }
# Stage 4b (media/file serving): Starlette's FileResponse etag is an MD5 over
# "mtime-size" (measured), its last-modified is an RFC 1123 GMT date, and
# ranged bodies stream — the etag/date/stream helpers are these three crates.
md5 = "0.7"
futures-util = "0.3"
httpdate = "1"
tokio-util = { version = "0.7", features = ["io"] }
chrono = "0.4"
